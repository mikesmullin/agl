[package]
name = "agl"
version = "0.1.7"
edition = "2021"
description = "Minimalist Pydantic-AI clone — Rust port of agl-ai."
license = "MIT"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
futures-util = "0.3.31"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "test-util"] }
